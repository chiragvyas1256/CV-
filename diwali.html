<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chiggy Diwali</title>
<meta name="description" content="A 12-second animated Diwali greeting for Chiggy Studio." />
<style>
  :root{
    --night-top:#1a0b2e;
    --night-mid:#3d1152;
    --night-bot:#5e1a3a;
    --gold:#ffcf6b;
    --gold-deep:#ff9d2f;
    --flame:#ffd36b;
    --ink:#fff4dc;
    --diya:#7a3a12;
    --diya-dark:#4f2409;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0b0417;
    color:var(--ink);
    font-family:"Trebuchet MS",'Segoe UI',system-ui,sans-serif;
    display:grid;
    place-items:center;
    min-height:100vh;
    overflow:hidden;
    padding:16px;
  }

  .stage{
    position:relative;
    width:min(92vw,900px);
    aspect-ratio:16/9;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,207,107,.15);
    background:
      radial-gradient(120% 90% at 50% 120%, var(--night-bot) 0%, transparent 55%),
      linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-bot) 100%);
  }

  /* stars */
  .stars{position:absolute;inset:0}
  .star{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;opacity:0;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1)}}

  /* moon glow */
  .moon{
    position:absolute;top:9%;right:11%;width:9%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff7e0, #ffe6a8 60%, #e9c978 100%);
    box-shadow:0 0 40px 10px rgba(255,220,150,.35);
    opacity:.9;
  }

  /* skyline silhouette */
  .skyline{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg, transparent, rgba(10,3,20,.2));}
  .skyline svg{position:absolute;bottom:0;width:100%;height:100%;display:block}

  /* fireworks */
  .fireworks{position:absolute;inset:0;pointer-events:none}
  .burst{position:absolute;width:0;height:0}
  .spark{
    position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0;
    animation:spark 1.6s ease-out forwards;
  }
  @keyframes spark{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    12%{opacity:1}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}
  }

  /* diyas row */
  .diyas{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:center;gap:4.5%;padding:0 6%}
  .diya{position:relative;width:11%;max-width:90px;transform:translateY(40px);opacity:0;animation:rise .9s ease-out forwards}
  .diya .bowl{
    width:100%;height:0;padding-bottom:42%;border-radius:0 0 999px 999px;
    background:linear-gradient(180deg,var(--diya) 0%,var(--diya-dark) 100%);
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.35);
    position:relative;
  }
  .diya .rim{position:absolute;top:0;left:0;right:0;height:22%;border-radius:999px;
    background:linear-gradient(180deg,#9a5420,#6e3912);}
  .diya .flame{
    position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    width:26%;padding-bottom:40%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff6c8, var(--flame) 45%, var(--gold-deep) 80%);
    box-shadow:0 0 22px 8px rgba(255,175,60,.55);
    transform-origin:bottom center;
    animation:flicker 1.1s ease-in-out infinite;
    opacity:0;
  }
  .diya.lit .flame{opacity:1}
  @keyframes flicker{
    0%,100%{transform:translateX(-50%) scaleY(1) rotate(-2deg)}
    50%{transform:translateX(-50%) scaleY(1.12) rotate(2deg)}
  }
  @keyframes rise{to{transform:translateY(0);opacity:1}}

  /* rangoli */
  .rangoli{
    position:absolute;left:50%;bottom:-6%;transform:translateX(-50%) scale(0) rotate(-40deg);
    width:30%;aspect-ratio:1;opacity:.0;
    animation:bloom 1.1s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes bloom{to{transform:translateX(-50%) scale(1) rotate(0);opacity:.85}}

  /* greeting text */
  .greet{
    position:absolute;left:0;right:0;top:26%;text-align:center;padding:0 8%;
  }
  .greet h1{
    font-size:clamp(26px,6.5vw,62px);
    letter-spacing:.5px;
    background:linear-gradient(180deg,#fff2c4,var(--gold) 45%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(255,160,60,.35);
    opacity:0;transform:translateY(18px) scale(.96);
    animation:reveal 1s ease-out forwards;
  }
  .greet p{
    margin-top:.4em;font-size:clamp(12px,2.6vw,20px);
    letter-spacing:4px;text-transform:uppercase;color:var(--gold);
    opacity:0;transform:translateY(12px);
    animation:reveal 1s ease-out .35s forwards;
  }
  .greet .brand{
    display:inline-block;margin-top:.9em;font-weight:bold;
    font-size:clamp(14px,3vw,24px);letter-spacing:2px;
    color:var(--ink);opacity:0;transform:translateY(12px);
    animation:reveal 1s ease-out .7s forwards;
  }
  .greet .brand span{color:var(--gold-deep)}
  @keyframes reveal{to{opacity:1;transform:translateY(0) scale(1)}}

  /* subtle floating embers */
  .ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;
    background:var(--gold);opacity:0;filter:blur(.3px);
    animation:float 6s linear infinite;}
  @keyframes float{
    0%{opacity:0;transform:translateY(0)}
    10%{opacity:.9}
    100%{opacity:0;transform:translateY(-320px)}
  }

  .replay{
    position:absolute;bottom:12px;right:14px;z-index:5;
    background:rgba(255,207,107,.12);color:var(--gold);
    border:1px solid rgba(255,207,107,.4);border-radius:999px;
    padding:6px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px);
  }
  .replay:hover{background:rgba(255,207,107,.22)}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>

    <div class="skyline">
      <svg viewBox="0 0 900 180" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#0a0314" d="M0,180 L0,120 L40,120 L40,80 L80,80 L80,110 L130,110 L130,60 L150,60 L150,40 L170,40 L170,60 L210,60 L210,100 L260,100 L260,70 L300,70 L300,110 L350,110 L350,55 L380,55 L380,110 L430,110 L430,85 L480,85 L480,120 L540,120 L540,70 L560,70 L560,45 L580,45 L580,70 L620,70 L620,105 L680,105 L680,75 L720,75 L720,110 L780,110 L780,90 L830,90 L830,120 L900,120 L900,180 Z"/>
      </svg>
    </div>

    <div class="fireworks" id="fireworks"></div>

    <div class="greet">
      <h1>Happy Diwali</h1>
      <p>Wishing you light &amp; joy</p>
      <div class="brand">from <span>Chiggy</span> Studio</div>
    </div>

    <div class="diyas" id="diyas"></div>

    <button class="replay" id="replay">↻ Replay</button>
  </div>

<script>
  const stage = document.getElementById('stage');

  // Stars
  const starWrap = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*62+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.width=s.style.height=(Math.random()*1.6+1)+'px';
    starWrap.appendChild(s);
  }

  // Embers
  for(let i=0;i<22;i++){
    const e=document.createElement('div');
    e.className='ember';
    e.style.left=Math.random()*100+'%';
    e.style.animationDelay=(Math.random()*6)+'s';
    e.style.animationDuration=(4+Math.random()*4)+'s';
    stage.appendChild(e);
  }

  const diyasWrap=document.getElementById('diyas');
  const fireworks=document.getElementById('fireworks');
  const colors=['#ffd36b','#ff7eb9','#7afcff','#b388ff','#ff8f3f','#7cff6b'];
  let fwTimers=[], lightTimers=[];

  function buildDiyas(){
    diyasWrap.innerHTML='';
    const n=5;
    for(let i=0;i<n;i++){
      const d=document.createElement('div');
      d.className='diya';
      d.style.animationDelay=(i*0.18)+'s';
      d.innerHTML='<div class="bowl"><div class="rim"></div><div class="flame"></div></div>';
      diyasWrap.appendChild(d);
      // light up flames one by one
      const t=setTimeout(()=>d.classList.add('lit'), 1400 + i*500);
      lightTimers.push(t);
    }
  }

  function fire(x,y){
    const burst=document.createElement('div');
    burst.className='burst';
    burst.style.left=x+'%';
    burst.style.top=y+'%';
    const color=colors[Math.floor(Math.random()*colors.length)];
    const count=26;
    for(let i=0;i<count;i++){
      const ang=(Math.PI*2*i)/count;
      const dist=60+Math.random()*50;
      const sp=document.createElement('div');
      sp.className='spark';
      sp.style.background=color;
      sp.style.boxShadow='0 0 8px '+color;
      sp.style.setProperty('--tx',(Math.cos(ang)*dist-0)+'px');
      sp.style.setProperty('--ty',(Math.sin(ang)*dist)+'px');
      sp.style.animationDelay=(Math.random()*0.1)+'s';
      burst.appendChild(sp);
    }
    fireworks.appendChild(burst);
    setTimeout(()=>burst.remove(),1800);
  }

  function play(){
    // clear
    fwTimers.forEach(clearTimeout); lightTimers.forEach(clearTimeout);
    fwTimers=[]; lightTimers=[];
    fireworks.innerHTML='';
    buildDiyas();

    // scripted fireworks between ~4s and ~11s
    const shots=[
      [4000,28,24],[4600,70,20],[5400,50,16],[6200,20,30],
      [7000,80,28],[7700,45,22],[8500,62,18],[9300,32,26],
      [10000,74,24],[10700,50,20]
    ];
    shots.forEach(([t,x,y])=>{
      fwTimers.push(setTimeout(()=>fire(x,y),t));
    });

    // loop
    fwTimers.push(setTimeout(play,13000));
  }

  // restart CSS entrance animations by cloning greeting
  const greet=document.querySelector('.greet');
  function restartGreet(){
    const clone=greet.cloneNode(true);
    greet.replaceWith(clone);
  }

  document.getElementById('replay').addEventListener('click',()=>{
    restartGreet();
    play();
  });

  play();
</script>
</body>
</html>
